[package]
name = "serial-tcp-proxy-rs"
version = "0.1.0"
edition = "2024"

[features]
default = []
mimalloc = ["dep:mimalloc"]
linear-hex = []

[dependencies]
futures-util = "0.3"
include_dir = "0.7"
serde = { version = "1", features = ["derive"] }
chrono = "0.4"
socket2 = { version = "0.6", features = ["all"] }
libc = "0.2"
base64 = "0.22"
getrandom = "0.3"
mimalloc = { version = "0.1", optional = true }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "sync", "time", "signal"] }
topcoat = { version = "0.11", default-features = false, features = ["router", "serve", "sse", "websocket"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
